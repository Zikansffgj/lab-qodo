name: pr-agent
on:
  pull_request:
    types: [opened, reopened, ready_for_review]
  issue_comment:
    types: [created]
jobs:
  pr_agent_job:
    if: ${{ github.event.sender.type != 'Bot' }}
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
      contents: read
    steps:
      - name: PR Agent action step
        env:
          OPENAI_KEY: dummy-key-for-config-error-lab
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CONFIG.GIT_PROVIDER: github
          PR_URL: ${{ github.event.pull_request.html_url || github.event.comment.pull_request.html_url }}
        uses: Codium-ai/pr-agent@master
